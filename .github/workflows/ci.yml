name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test
      - name: ASCII only
        run: |
          # Every file is checked except the compressed chunk files of the
          # conformance Zarr store (conformance/tiny.zarr/<row>.<col>) and
          # the Arrow IPC data fixtures (fixtures/data/*.arrows and
          # fixtures/data/invalid/*.arrows). Their scenes are still checked.
          bad=$(grep -rlP '[^\x00-\x7F]' . --exclude-dir=node_modules --exclude-dir=.git |
            grep -vE '^\./conformance/tiny\.zarr/[0-9]+\.[0-9]+$' |
            grep -vE '^\./fixtures/data/(invalid/)?[a-z0-9-]+\.arrows$' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "Non-ASCII characters found in the files above"; exit 1
          fi
